name: Déployer sur OVHcloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arivoli-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Récupérer le site
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Vérifier le JavaScript
        run: node --check assets/cohorte.js

      - name: Vérifier la configuration SFTP
        id: config
        env:
          SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ vars.OVH_SFTP_KNOWN_HOSTS }}
        run: |
          ready=true
          if [[ -z "$SFTP_PASSWORD" ]]; then
            echo "::notice::Le secret OVH_SFTP_PASSWORD est manquant."
            ready=false
          fi
          if [[ -z "$SFTP_KNOWN_HOSTS" ]]; then
            echo "::notice::La variable OVH_SFTP_KNOWN_HOSTS est manquante."
            echo "inspect_host=true" >> "$GITHUB_OUTPUT"
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Relever les clés publiques présentées par le serveur OVHcloud
        if: steps.config.outputs.inspect_host == 'true'
        run: |
          host_keys=$(mktemp)
          trap 'rm -f "$host_keys"' EXIT
          ssh-keyscan -T 8 -t ed25519,ecdsa,rsa ftp.cluster129.hosting.ovh.net > "$host_keys" || true
          if [[ -s "$host_keys" ]]; then
            {
              echo '## Clés SSH présentées par OVHcloud'
              echo 'Comparez leur empreinte à celle d’une connexion SFTP de confiance avant de renseigner OVH_SFTP_KNOWN_HOSTS.'
              echo
              echo '~~~text'
              ssh-keygen -lf "$host_keys"
              cat "$host_keys"
              echo '~~~'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Le serveur SFTP n’a renvoyé aucune clé publique lors de ce contrôle."
          fi

      - name: Installer le client d’authentification SFTP
        if: steps.config.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Transférer les fichiers sur OVHcloud
        if: steps.config.outputs.ready == 'true'
        env:
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ vars.OVH_SFTP_KNOWN_HOSTS }}
        run: |
          known_hosts=$(mktemp)
          trap 'rm -f "$known_hosts"' EXIT
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$known_hosts"

          sshpass -e sftp -o BatchMode=no -b - \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o ConnectTimeout=15 \
            -P 22 arivolifth@ftp.cluster129.hosting.ovh.net <<'SFTP'
          cd www
          -mkdir assets
          put assets/arivoli.svg assets/.arivoli.svg.upload
          rename assets/.arivoli.svg.upload assets/arivoli.svg
          put assets/editorial.css assets/.editorial.css.upload
          rename assets/.editorial.css.upload assets/editorial.css
          put assets/cohorte.js assets/.cohorte.js.upload
          rename assets/.cohorte.js.upload assets/cohorte.js
          put priorites.html .priorites.html.upload
          rename .priorites.html.upload priorites.html
          put gilbert-maury.html .gilbert-maury.html.upload
          rename .gilbert-maury.html.upload gilbert-maury.html
          put cas-usages.html .cas-usages.html.upload
          rename .cas-usages.html.upload cas-usages.html
          put index.html .index.html.upload
          rename .index.html.upload index.html
          SFTP

      - name: Vérifier le site publié
        if: steps.config.outputs.ready == 'true'
        run: |
          for page in index.html priorites.html gilbert-maury.html; do
            curl --fail --silent --show-error --max-time 25 "https://arivoli.fr/$page?revision=$GITHUB_SHA" -o "$RUNNER_TEMP/live.html"
            cmp "$page" "$RUNNER_TEMP/live.html"
          done
